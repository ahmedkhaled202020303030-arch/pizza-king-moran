
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza King & Morin - خدمة العملاء</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#14263d;--navy-2:#203b5b;--orange:#f28c28;--orange-dark:#d96d12;
  --ink:#243247;--muted:#718096;--line:#e5eaf0;--surface:#fff;--bg:#f3f6fa;
  --green:#16845b;--red:#c0393b;--shadow:0 12px 32px rgba(20,38,61,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink);line-height:1.65}
header{
  position:relative;overflow:hidden;text-align:center;color:#fff;padding:34px 18px 30px;
  background:linear-gradient(125deg,var(--navy) 0%,var(--navy-2) 68%,#315477 100%);
  border-bottom:5px solid var(--orange)
}
header:before,header:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
header:before{width:230px;height:230px;top:-145px;right:-45px}
header:after{width:180px;height:180px;bottom:-135px;left:7%}
header h1{position:relative;margin:0;font-size:clamp(25px,5vw,36px);font-weight:800;letter-spacing:.2px}
header p{position:relative;margin:7px 0 0;color:#dce6f1;font-size:14px}
main{width:min(1080px,100%);margin:28px auto;padding:0 18px 40px}
.panel{background:var(--surface);padding:24px;margin:0 0 18px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
#loginPanel{max-width:560px;margin:38px auto;padding:30px}
h2{margin:0 0 16px;color:var(--navy);font-size:20px;font-weight:800}
h3{margin:0 0 10px;color:var(--navy);font-size:18px}
label{display:block;margin:15px 0 7px;font-weight:700;font-size:13px;color:#34465c}
input,select,textarea{
  width:100%;min-width:0;padding:13px 14px;border:1px solid #d8e0e9;border-radius:11px;
  background:#fbfcfe;color:var(--ink);font:inherit;font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s
}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,140,40,.15);background:#fff}
textarea{min-height:105px;resize:vertical}
button{
  width:100%;padding:13px 16px;border:0;border-radius:11px;background:var(--orange);color:#fff;
  margin-top:10px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;
  box-shadow:0 5px 12px rgba(242,140,40,.18);transition:transform .15s,filter .15s,box-shadow .15s
}
button:hover{filter:brightness(.97);transform:translateY(-1px);box-shadow:0 7px 16px rgba(20,38,61,.12)}
button:active{transform:translateY(0)}
.secondary{background:var(--navy-2);box-shadow:none}
.light{background:#edf2f7;color:var(--navy);box-shadow:none}
.danger{background:var(--red);box-shadow:none}
.row{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:145px}
#appPanel>.panel:first-child .row{align-items:center}
#appPanel>.panel:first-child p{margin:5px 0 0}
#appPanel>.panel:first-child .row>div:last-child{display:flex;gap:8px}
#appPanel>.panel:first-child .row>div:last-child button{margin-top:0}
.hidden{display:none!important}
.msg{padding:12px 14px;background:#fff4df;border:1px solid #f5d79e;color:#74521c;border-radius:11px;margin:12px 0;font-size:13px}
.muted{color:var(--muted);font-size:13px}
#recordsHint{margin:14px 0;color:var(--muted);font-weight:700}
#records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.record{
  min-width:0;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin:0;
  box-shadow:0 5px 16px rgba(20,38,61,.045);border-top:3px solid var(--orange)
}
.record p{margin:8px 0;line-height:1.7;font-size:14px;overflow-wrap:anywhere}
.record a{color:#1769aa;font-weight:700;text-decoration:none}
.record a:hover{text-decoration:underline}
.tag{display:inline-block;background:#fff0df;color:#a6530b;padding:5px 11px;border-radius:30px;font-size:12px;font-weight:800}
.record button{width:auto;min-width:92px;padding:9px 15px;margin:8px 6px 0 0;font-size:13px}
#searchInput,#branchFilter{align-self:end}
input[type=file]{padding:10px;background:#f8fafc}
@media(max-width:680px){
  header{padding:27px 14px 24px}
  main{margin:16px auto;padding:0 12px 28px}
  .panel{padding:17px;margin-bottom:13px;border-radius:15px}
  #loginPanel{margin:18px auto;padding:21px}
  #records{grid-template-columns:1fr;gap:11px}
  .row{gap:9px}
  .row>*{min-width:100%;flex-basis:100%}
  #appPanel>.panel:first-child .row>div:last-child{width:100%;flex-direction:row}
  #appPanel>.panel:first-child .row>div:last-child button{flex:1}
  button{padding:12px}
  .record{padding:15px}
}
@media(min-width:681px) and (max-width:850px){#records{grid-template-columns:1fr}}

.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 18px}
.stat-card{display:flex;align-items:center;gap:13px;min-width:0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 20px rgba(20,38,61,.055)}
.stat-icon{display:grid;place-items:center;flex:0 0 45px;width:45px;height:45px;border-radius:13px;background:#fff0df;font-size:21px}
.stat-card p{margin:0 0 3px;color:var(--muted);font-size:12px;font-weight:700}
.stat-card strong{display:block;color:var(--navy);font-size:25px;line-height:1.2;font-weight:900}
@media(max-width:680px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat-card{padding:13px 11px;gap:9px}.stat-icon{flex-basis:38px;width:38px;height:38px;font-size:18px}.stat-card strong{font-size:21px}.stat-card p{font-size:11px}}

</style>
</head>
<body>

<header>
<h1>Pizza King & Morin</h1>
<p>نظام مركزي لإدارة ومتابعة خدمة العملاء</p>
</header>

<main>
<section id="loginPanel" class="panel">
<h2>تسجيل الدخول</h2>
<p class="muted">اختر الدخول كمدير أو المتابعة كزائر للعرض فقط.</p>
<div id="loginMsg" class="msg hidden"></div>

<label>البريد الإلكتروني للمدير</label>
<input id="email" type="email" placeholder="البريد الإلكتروني المسجل في Supabase">

<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">

<div class="row">
<button id="adminLogin">دخول المدير</button>
<button id="guestLogin" class="secondary">الدخول كزائر</button>
</div>
</section>

<section id="appPanel" class="hidden">
<div class="panel">
<div class="row">
<div>
<strong>مرحباً بك</strong>
<p id="roleText" class="muted"></p>
</div>
<div>
<button id="refreshBtn" class="light">تحديث البيانات</button>
<button id="logoutBtn" class="secondary">خروج</button>
</div>
</div>
</div>


<section class="stats-grid" aria-label="إحصائيات العملاء">
  <div class="stat-card"><span class="stat-icon">👥</span><div><p>إجمالي العملاء</p><strong id="statTotal">0</strong></div></div>
  <div class="stat-card"><span class="stat-icon">🏬</span><div><p>الفروع النشطة</p><strong id="statBranches">0</strong></div></div>
  <div class="stat-card"><span class="stat-icon">📅</span><div><p>زيارات اليوم</p><strong id="statToday">0</strong></div></div>
  <div class="stat-card"><span class="stat-icon">🎙️</span><div><p>تسجيلات صوتية</p><strong id="statAudio">0</strong></div></div>
</section>

<section id="formPanel" class="panel hidden">
<h2 id="formTitle">إضافة سجل عميل</h2>
<div id="formMsg" class="msg hidden"></div>
<input id="editId" type="hidden">

<label>اسم العميل</label>
<input id="customerName">

<label>رقم الهاتف</label>
<input id="phone" inputmode="tel">

<label>الفرع</label>
<select id="branch">
<option value="">اختر الفرع</option>
</select>

<label>تاريخ الزيارة</label>
<input id="visitDate" type="date">

<label>تعليقات وملاحظات</label>
<textarea id="comments"></textarea>

<label>تسجيل صوتي اختياري</label>
<input id="audioFile" type="file" accept="audio/*">

<button id="saveBtn">حفظ السجل</button>
<button id="cancelEdit" class="light">إلغاء</button>
</section>

<section class="panel">
<h2>سجلات العملاء</h2>
<div class="row">
<input id="searchInput" placeholder="بحث بالاسم أو الهاتف">
<select id="branchFilter">
<option value="">كل الفروع</option>
</select>
</div>
<p id="recordsHint" class="muted">جاهز لتحميل البيانات</p>
<div id="records"></div>
</section>
</section>
</main>

<script>
const SUPABASE_URL = 'https://mrbdigdeawtoetqdpoye.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6-QrCruaBq6WvA47-iJ6Mw_xxYSg6cy';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const branches = [
'عباس العقاد','الشمس','روكسي','مصر حلوان','المعادي',
'زهراء المعادي','شبرا','باب اللوق','المقطم','العبور',
'الشروق','التجمع الخامس','جولدن سكوير','الرحاب',
'المنيل','الخزان','الهرم','زايد'
];

const $ = id => document.getElementById(id);
let currentUser = null;
let isAdmin = false;
let allRecords = [];

function showMessage(id, text, error=false) {
  const el = $(id);
  el.textContent = text;
  el.classList.remove('hidden');
  el.style.background = error ? '#fde8e8' : '#e7f6ed';
}

function hideMessage(id) {
  $(id).classList.add('hidden');
}

function fillBranches() {
  branches.forEach(branch => {
    $('branch').add(new Option(branch, branch));
    $('branchFilter').add(new Option(branch, branch));
  });
}

function today() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}

async function loginAdmin() {
  hideMessage('loginMsg');
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !password) {
    showMessage('loginMsg','اكتب البريد الإلكتروني وكلمة المرور.',true);
    return;
  }

  const {data,error} = await db.auth.signInWithPassword({email,password});

  if (error) {
    showMessage('loginMsg','تعذر تسجيل الدخول: '+error.message,true);
    return;
  }

  const {data:profile,error:profileError} = await db
    .from('profiles')
    .select('role')
    .eq('user_id',data.user.id)
    .maybeSingle();

  if (profileError || !profile || profile.role !== 'admin') {
    await db.auth.signOut();
    showMessage('loginMsg','الحساب ليس لديه صلاحية مدير.',true);
    return;
  }

  await showApp(data.user,true);
}

async function loginGuest() {
  hideMessage('loginMsg');
  const {data,error} = await db.auth.signInAnonymously();

  if (error) {
    showMessage('loginMsg','تعذر دخول الزائر: '+error.message,true);
    return;
  }

  await showApp(data.user,false);
}

async function showApp(user,admin) {
  currentUser = user;
  isAdmin = admin;
  $('loginPanel').classList.add('hidden');
  $('appPanel').classList.remove('hidden');
  $('roleText').textContent = admin ? 'صلاحية مدير' : 'زائر - عرض فقط';
  $('formPanel').classList.toggle('hidden',!admin);
  await loadRecords();
}

async function logout() {
  await db.auth.signOut();
  currentUser = null;
  isAdmin = false;
  $('appPanel').classList.add('hidden');
  $('loginPanel').classList.remove('hidden');
}

function updateStats() {
  const total = allRecords.length;
  const activeBranches = new Set(allRecords.map(r => r.branch).filter(Boolean)).size;
  const todayVisits = allRecords.filter(r => r.visit_date === today()).length;
  const audioCount = allRecords.filter(r => r.audio_path).length;
  $('statTotal').textContent = total.toLocaleString('ar-EG');
  $('statBranches').textContent = activeBranches.toLocaleString('ar-EG');
  $('statToday').textContent = todayVisits.toLocaleString('ar-EG');
  $('statAudio').textContent = audioCount.toLocaleString('ar-EG');
}

async function loadRecords() {
  $('recordsHint').textContent = 'جاري تحميل البيانات...';

  const {data,error} = await db
    .from('customers')
    .select('*')
    .order('created_at',{ascending:false});

  if (error) {
    $('recordsHint').textContent = 'تعذر تحميل السجلات';
    $('records').textContent = error.message;
    return;
  }

  allRecords = data || [];
  updateStats();
  renderRecords();
}

async function renderRecords() {
  const query = $('searchInput').value.trim().toLowerCase();
  const branch = $('branchFilter').value;

  const list = allRecords.filter(r =>
    (!branch || r.branch === branch) &&
    (!query ||
      String(r.customer_name || '').toLowerCase().includes(query) ||
      String(r.phone || '').toLowerCase().includes(query))
  );

  $('recordsHint').textContent =
    'عرض ' + list.length + ' من ' + allRecords.length + ' سجل';

  if (!list.length) {
    $('records').textContent = 'لا توجد سجلات مطابقة.';
    return;
  }

  let html = '';

  for (const r of list) {
    let audio = '';

    if (r.audio_path) {
      const {data} = await db.storage
        .from('customer-audio')
        .createSignedUrl(r.audio_path,3600);

      if (data?.signedUrl) {
        audio = `<p><a href="${data.signedUrl}" target="_blank">تشغيل التسجيل الصوتي</a></p>`;
      }
    }

    html += `
      <article class="record">
        <h3>${escapeHTML(r.customer_name)}</h3>
        <p><span class="tag">${escapeHTML(r.branch)}</span></p>
        <p>الهاتف: ${escapeHTML(r.phone)}</p>
        <p>تاريخ الزيارة: ${escapeHTML(r.visit_date)}</p>
        <p>التعليقات: ${escapeHTML(r.comments || 'لا توجد تعليقات')}</p>
        ${audio}
        ${isAdmin ? `
          <button class="light" onclick="editRecord('${escapeHTML(r.id)}')">تعديل</button>
          <button class="danger" onclick="deleteRecord('${escapeHTML(r.id)}')">حذف</button>
        ` : ''}
      </article>`;
  }

  $('records').innerHTML = html;
}

function resetForm() {
  $('editId').value = '';
  $('customerName').value = '';
  $('phone').value = '';
  $('branch').value = '';
  $('visitDate').value = today();
  $('comments').value = '';
  $('audioFile').value = '';
  $('formTitle').textContent = 'إضافة سجل عميل';
  $('saveBtn').textContent = 'حفظ السجل';
  hideMessage('formMsg');
}

async function saveRecord() {
  if (!isAdmin) return;

  hideMessage('formMsg');

  const name = $('customerName').value.trim();
  const phone = $('phone').value.trim();
  const branch = $('branch').value;
  const date = $('visitDate').value;
  const id = $('editId').value;

  if (!name || !phone || !branch || !date) {
    showMessage('formMsg','أكمل الاسم والهاتف والفرع والتاريخ.',true);
    return;
  }

  let audioPath = null;
  const file = $('audioFile').files[0];

  if (file) {
    const safeName = file.name.replace(/[^\w.-]/g,'_');
    audioPath = currentUser.id + '/' + Date.now() + '_' + safeName;

    const {error} = await db.storage
      .from('customer-audio')
      .upload(audioPath,file);

    if (error) {
      showMessage('formMsg','تعذر رفع التسجيل: '+error.message,true);
      return;
    }
  }

  const payload = {
    customer_name:name,
    phone:phone,
    branch:branch,
    visit_date:date,
    comments:$('comments').value.trim() || null
  };

  if (audioPath) payload.audio_path = audioPath;
  if (!id) payload.created_by = currentUser.id;

  const result = id
    ? await db.from('customers').update(payload).eq('id',id)
    : await db.from('customers').insert(payload);

  if (result.error) {
    showMessage('formMsg','تعذر حفظ السجل: '+result.error.message,true);
    return;
  }

  showMessage('formMsg','تم حفظ السجل بنجاح.');
  resetForm();
  await loadRecords();
}

function editRecord(id) {
  if (!isAdmin) return;

  const r = allRecords.find(x => String(x.id) === String(id));
  if (!r) return;

  $('editId').value = r.id;
  $('customerName').value = r.customer_name || '';
  $('phone').value = r.phone || '';
  $('branch').value = r.branch || '';
  $('visitDate').value = r.visit_date || today();
  $('comments').value = r.comments || '';
  $('formTitle').textContent = 'تعديل سجل عميل';
  $('saveBtn').textContent = 'حفظ التعديلات';
  $('formPanel').scrollIntoView({behavior:'smooth'});
}

async function deleteRecord(id) {
  if (!isAdmin) return;
  if (!confirm('هل أنت متأكد من حذف السجل؟')) return;

  const {error} = await db.from('customers').delete().eq('id',id);

  if (error) {
    alert('تعذر الحذف: '+error.message);
    return;
  }

  await loadRecords();
}

$('adminLogin').addEventListener('click',loginAdmin);
$('guestLogin').addEventListener('click',loginGuest);
$('logoutBtn').addEventListener('click',logout);
$('refreshBtn').addEventListener('click',loadRecords);
$('saveBtn').addEventListener('click',saveRecord);
$('cancelEdit').addEventListener('click',resetForm);
$('searchInput').addEventListener('input',renderRecords);
$('branchFilter').addEventListener('change',renderRecords);

fillBranches();
$('visitDate').value = today();
</script>
</body>
  </html>
