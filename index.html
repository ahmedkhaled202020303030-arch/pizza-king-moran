<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza King & Moran | خدمة العملاء</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#b51f2b;--dark:#20242a;--gold:#e7b84b;--bg:#f4f5f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#222}.top{background:var(--dark);color:white;padding:18px 16px;text-align:center;border-bottom:4px solid var(--gold)}.top h1{margin:0;font-size:22px}.top p{margin:7px 0 0;color:#ddd;font-size:13px}.wrap{max-width:1050px;margin:20px auto;padding:0 12px}.panel{background:white;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px #0000000d}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #d6d9de;border-radius:9px;background:white}textarea{min-height:80px}button{border:0;background:var(--red);color:white;font-weight:bold;cursor:pointer;margin-top:10px}button.secondary{background:#555}button.light{background:#eee;color:#222}button.danger{background:#8d1b22}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{width:auto;flex:1;min-width:100px}.status{padding:10px;border-radius:8px;background:#fff4d7;color:#624a0a;margin:10px 0;font-size:13px}.status.ok{background:#e7f6ed;color:#176438}.status.err{background:#fde8e8;color:#8c1d1d}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:120px;background:#f8f8f8;border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:23px;color:var(--red)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:13px}th{background:#f7f7f7}.muted{color:#777;font-size:12px}.record{border:1px solid #eee;border-radius:10px;padding:12px;margin:10px 0}.record h3{margin:0 0 7px;font-size:16px}.record p{margin:5px 0;font-size:13px}.tag{display:inline-block;background:#f3e6e7;color:#8e1821;border-radius:20px;padding:4px 9px;font-size:11px}.footer{text-align:center;color:#888;font-size:11px;padding:20px}
</style></head>
<body>
<header class="top"><h1>Pizza King & Moran</h1><p>نظام مركزي لإدارة ومتابعة خدمة العملاء</p></header>
<main class="wrap">
<section id="loginPanel" class="panel"><h2>تسجيل الدخول</h2><p class="muted">اختر الدخول كمدير أو المتابعة كزائر للعرض فقط.</p>
<div id="loginMsg" class="status hidden"></div>
<label>البريد الإلكتروني للمدير</label><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني المسجل في Supabase">
<label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
<div class="actions"><button id="adminLogin">دخول المدير</button><button id="guestLogin" class="secondary">الدخول كزائر</button></div>
</section>
<section id="appPanel" class="hidden">
<div class="panel row" style="align-items:center"><div><b id="welcome">أهلاً بك</b><div class="muted" id="roleText"></div></div><div class="actions" style="max-width:180px"><button id="refreshBtn" class="light">تحديث البيانات</button><button id="logoutBtn" class="secondary">خروج</button></div></div>
<div class="panel"><div class="stats"><div class="stat"><b id="totalCount">0</b><span>إجمالي السجلات</span></div><div class="stat"><b id="branchCount">0</b><span>الفروع المسجلة</span></div></div>
<div class="row"><div><label>بحث بالاسم أو الهاتف</label><input id="searchInput" placeholder="اكتب للبحث..."></div><div><label>تصفية حسب الفرع</label><select id="branchFilter"><option value="">كل الفروع</option></select></div></div></div>
<section id="formPanel" class="panel hidden"><h2 id="formTitle">إضافة سجل عميل</h2><div id="formMsg" class="status hidden"></div><input id="editId" type="hidden">
<div class="row"><div><label>اسم العميل *</label><input id="customerName" required></div><div><label>رقم الهاتف *</label><input id="phone" inputmode="tel" required></div></div>
<div class="row"><div><label>الفرع *</label><select id="branch" required></select></div><div><label>تاريخ الزيارة *</label><input id="visitDate" type="date" required></div></div>
<label>تعليقات وملاحظات</label><textarea id="comments" placeholder="اكتب تفاصيل الزيارة أو ملاحظات العميل"></textarea>
<label>تسجيل صوتي (اختياري)</label><input id="audioFile" type="file" accept="audio/*">
<div class="actions"><button id="saveBtn">حفظ السجل</button><button id="cancelEdit" class="light">إلغاء</button></div></section>
<section class="panel"><div class="row" style="align-items:center"><h2 style="margin:0">سجلات العملاء</h2><span class="muted" id="recordsHint">يتم تحميل البيانات...</span></div><div id="records"></div></section>
</section>
<div class="footer">Pizza King & Moran · نظام خدمة العملاء</div></main>
<script>
const SUPABASE_URL='https://mrbdigdeawtoetqdpoye.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_6-QrCruaBq6WvA47-iJ6Mw_xxYSg6cy';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const branches=['عباس العقاد','الشمس','روكسي','مصر حلوان','المعادي','زهراء المعادي','شبرا','باب اللوق','المقطم','العبور','الشروق','التجمع الخامس','جولدن سكوير','الرحاب','المنيل','الخزان','الهرم','زايد'];
let currentUser=null,isAdmin=false,allRecords=[];
const $=id=>document.getElementById(id);
function message(id,text,type=''){const el=$(id);el.textContent=text;el.className='status '+type;el.classList.remove('hidden')}
function hide(id){$(id).classList.add('hidden')}
function fillBranches(){ $('branch').innerHTML='<option value="">اختر الفرع</option>'+branches.map(x=>`<option>${x}</option>`).join(''); $('branchFilter').innerHTML='<option value="">كل الفروع</option>'+branches.map(x=>`<option>${x}</option>`).join('') }
function today(){return new Date().toLocaleDateString('en-CA')}
function resetForm(){ $('editId').value='';$('customerName').value='';$('phone').value='';$('branch').value='';$('visitDate').value=today();$('comments').value='';$('audioFile').value='';$('formTitle').textContent='إضافة سجل عميل';$('saveBtn').textContent='حفظ السجل';hide('formMsg') }
async function showApp(user,admin){currentUser=user;isAdmin=admin;$('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');$('welcome').textContent='مرحباً بك';$('roleText').textContent=admin?'صلاحية مدير':'زائر – عرض فقط';$('formPanel').classList.toggle('hidden',!admin);await loadRecords()}
async function loginAdmin(){hide('loginMsg');const email=$('email').value.trim(),password=$('password').value;if(!email||!password){message('loginMsg','اكتب البريد الإلكتروني وكلمة المرور.','err');return}const {data,error}=await db.auth.signInWithPassword({email,password});if(error){message('loginMsg','تعذر تسجيل الدخول: '+error.message,'err');return}const {data:profile,error:pe}=await db.from('profiles').select('role').eq('user_id',data.user.id).maybeSingle();if(pe||!profile||profile.role!=='admin'){await db.auth.signOut();message('loginMsg','هذا الحساب ليس لديه صلاحية مدير في جدول profiles.','err');return}await showApp(data.user,true)}
async function loginGuest(){hide('loginMsg');const {data,error}=await db.auth.signInAnonymously();if(error){message('loginMsg','تعذر دخول الزائر: '+error.message,'err');return}await showApp(data.user,false)}
async function logout(){await db.auth.signOut();currentUser=null;isAdmin=false;$('appPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden')}
async function loadRecords(){ $('recordsHint').textContent='جاري التحميل...';const {data,error}=await db.from('customers').select('*').order('created_at',{ascending:false});if(error){$('recordsHint').textContent='تعذر تحميل السجلات';$('records').innerHTML='<div class="status err">'+escapeHtml(error.message)+'</div>';return}allRecords=data||[];renderRecords() }
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function renderRecords(){const q=$('searchInput').value.trim().toLowerCase(),b=$('branchFilter').value;const list=allRecords.filter(r=>(!b||r.branch===b)&&(!q||String(r.customer_name||'').toLowerCase().includes(q)||String(r.phone||'').toLowerCase().includes(q)));$('totalCount').textContent=allRecords.length;$('branchCount').textContent=new Set(allRecords.map(r=>r.branch).filter(Boolean)).size;$('recordsHint').textContent=`عرض ${list.length} من ${allRecords.length}`;if(!list.length){$('records').innerHTML='<p class="muted">لا توجد سجلات مطابقة.</p>';return}let html='';for(const r of list){let audio='';if(r.audio_path){const {data}=await db.storage.from('customer-audio').createSignedUrl(r.audio_path,3600);if(data?.signedUrl)audio=`<p><a href="${data.signedUrl}" target="_blank" rel="noopener">▶ تشغيل التسجيل الصوتي</a></p>`}html+=`<article class="record"><h3>${escapeHtml(r.customer_name||'—')}</h3><p><span class="tag">${escapeHtml(r.branch||'بدون فرع')}</span></p><p>📞 ${escapeHtml(r.phone||'—')}　 |　 📅 ${escapeHtml(r.visit_date||'—')}</p><p>${escapeHtml(r.comments||'لا توجد تعليقات')}</p>${audio}${isAdmin?`<div class="actions"><button class="light" onclick="editRecord('${String(r.id).replace(/'/g,'')}')">تعديل</button><button class="danger" onclick="deleteRecord('${String(r.id).replace(/'/g,'')}')">حذف</button></div>`:''}</article>`}$('records').innerHTML=html}
async function saveRecord(){if(!isAdmin)return;hide('formMsg');const name=$('customerName').value.trim(),phone=$('phone').value.trim(),branch=$('branch').value,date=$('visitDate').value;if(!name||!phone||!branch||!date){message('formMsg','من فضلك أكمل الاسم والهاتف والفرع وتاريخ الزيارة.','err');return}const id=$('editId').value;let audioPath=null;const file=$('audioFile').files[0];if(file){const safe=file.name.replace(/[^\w.\-]/g,'_');audioPath=`${currentUser.id}/${Date.now()}_${safe}`;const {error}=await db.storage.from('customer-audio').upload(audioPath,file,{upsert:false});if(error){message('formMsg','تعذر رفع التسجيل: '+error.message,'err');return}}
const payload={customer_name:name,phone,branch,visit_date:date,comments:$('comments').value.trim()||null};if(audioPath)payload.audio_path=audioPath;if(!id)payload.created_by=currentUser.id;let result=id?await db.from('customers').update(payload).eq('id',id):await db.from('customers').insert(payload);if(result.error){message('formMsg','تعذر حفظ السجل: '+result.error.message,'err');return}message('formMsg','تم حفظ السجل بنجاح.','ok');resetForm();await loadRecords()}
function editRecord(id){if(!isAdmin)return;const r=allRecords.find(x=>String(x.id)===String(id));if(!r)return;$('editId').value=r.id;$('customerName').value=r.customer_name||'';$('phone').value=r.phone||'';$('branch').value=r.branch||'';$('visitDate').value=r.visit_date||today();$('comments').value=r.comments||'';$('audioFile').value='';$('formTitle').textContent='تعديل سجل عميل';$('saveBtn').textContent='حفظ التعديلات';$('formPanel').scrollIntoView({behavior:'smooth'})}
async function deleteRecord(id){if(!isAdmin||!confirm('هل أنت متأكد من حذف هذا السجل؟'))return;const {error}=await db.from('customers').delete().eq('id',id);if(error){alert('تعذر الحذف: '+error.message);return}await loadRecords()}
$('adminLogin').addEventListener('click',loginAdmin);$('guestLogin').addEventListener('click',loginGuest);$('logoutBtn').addEventListener('click',logout);$('refreshBtn').addEventListener('click',loadRecords);$('saveBtn').addEventListener('click',saveRecord);$('cancelEdit').addEventListener('click',resetForm);$('searchInput').addEventListener('input',renderRecords);$('branchFilter').addEventListener('change',renderRecords);fillBranches();$('visitDate').value=today();
</script></body></html>
